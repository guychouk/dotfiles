# https://gh-dash.dev/schema.json
prSections:
  - title: My PRs
    filters: is:open author:@me
  - title: Ready
    filters: is:open draft:false -author:@me
  - title: Drafts
    filters: is:open draft:true -author:@me
issuesSections:
  - title: My Issues
    filters: is:open author:@me
  - title: Assigned
    filters: is:open assignee:@me
  - title: Involved
    filters: is:open involves:@me -author:@me
defaults:
  preview:
    open: false
    width: 0.45
    position: bottom
    height: 0.6
    prsLimit: 20
    prApproveComment: lgtm
    issuesLimit: 20
    notificationsLimit: 20
    view: prs
  layout:
    prs:
      repo:
        hidden: true
      author:
        width: 25
  refetchIntervalMinutes: 30
keybindings:
  prs:
    - key: R
      name: Rerun failed checks
      command: >-
        gh pr checks {{.PrNumber}} --repo {{.RepoName}} --json state,link
        | jq -r '.[] | select(.state=="FAILURE") | .link'
        | grep -oE 'runs/[0-9]+' | grep -oE '[0-9]+' | sort -u
        | xargs -I{} gh run rerun {} --repo {{.RepoName}} --failed
    - key: M
      name: Add me as reviewer
      command: gh pr edit {{.PrNumber}} --repo {{.RepoName}} --add-reviewer guychouk
theme:
  ui:
    sectionsShowCount: false
    table:
      showSeparator: true
      compact: true
pager:
  diff: ""
confirmQuit: false
showAuthorIcons: false
smartFilteringAtLaunch: true
includeReadNotifications: true
